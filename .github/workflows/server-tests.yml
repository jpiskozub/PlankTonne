name: Server Tests

on:
  push:
    branches: [main]
    paths: [server/**]
  pull_request:
    branches: [main]
    paths: [server/**]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app

      - name: Tests
        run: uv run pytest -v
